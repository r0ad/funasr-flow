# 本地 / 单机服务器部署（CPU 版镜像；GPU 见 docker-compose.gpu.yml）。
#
#   docker compose up -d --build     # 然后打开 http://127.0.0.1:8000
#
# 音频怎么进来：不需要挂载任何宿主机目录 —— 网页里直接拖入文件，走 HTTP 上传进资料库。
# 数据默认放命名卷里（docker 自己管理）；想在本机文件夹里看到它，把下面 volumes 里
# flow-data 那行换成注释里的绑定写法即可（绑到网络盘也没问题，SQLite 会自动降级日志模式）。
name: funasr-flow

services:
  funasr-flow:
    build:
      context: .
      dockerfile: Dockerfile
    image: funasr-flow:latest
    container_name: funasr-flow
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      FLOW_DATA_DIR: /data
      FLOW_CACHE_DIR: /cache
      FLOW_LOG_LEVEL: INFO
      TZ: Asia/Shanghai

    volumes:
      # 资料库 + 数据库 + 导出结果；默认命名卷，不用管宿主机路径
      - flow-data:/data
      # 想放到本机文件夹（方便备份/直接拷录音进去）就删掉上一行，改用这一行：
      # - ./data:/data
      - flow-cache:/cache
      # 模型缓存同理，想复用本机已有的模型可以换成：- ./cache:/cache

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  flow-data:
  flow-cache:
