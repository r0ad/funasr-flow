[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funasr-flow"
version = "0.1.0"
description = "本地优先的通话录音批量转写：FunASR + 说话人分离 + 网页界面"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "funasr-flow contributors" }]
keywords = ["asr", "funasr", "speaker-diarization", "transcription", "chinese", "dialect", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "numpy>=1.24,<3",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# 完整识别能力（体积较大，含 PyTorch）。GPU 用户想用 CUDA 时先自行装带 cuda 的 torch。
asr = [
  "funasr>=1.2",
  "torch>=2.1",
  "torchaudio>=2.1",
  "modelscope>=1.15",
  "huggingface-hub>=0.23",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "httpx>=0.27",
  "build>=1.2",
  "twine>=5",
  "pre-commit>=3.7",
]

[project.scripts]
funasr-flow = "backend.app.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/funasr-flow"
Issues = "https://github.com/your-name/funasr-flow/issues"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", ".cache", "data", "CallRecord"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
