# 持续集成：后端 lint + 多版本测试 + 前端构建。
# 打包发布（打 v* tag）走 release.yml，这里对 tag 不做处理。
#
# 设计约束：
#   * 只安装 .[dev]（pytest / ruff / httpx），绝不安装 .[asr]（funasr + torch 数 GB）
#   * 测试不下载模型、不联网，funasr / torch 只在运行期按需 import
#   * 前端尚未提交时，frontend-build 会优雅跳过而不是失败
name: CI

"on":
  push:
    branches: [main, master]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支连续 push 时取消旧跑，省 runner 额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------ lint
  backend-lint:
    name: backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies (ASR stack excluded)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check backend --output-format=github

      # 格式化检查：ruff format 由 pyproject 的 line-length=100 配置决定，无需额外配置段
      - name: ruff format --check
        run: ruff format --check backend

  # ------------------------------------------------------------------ test
  backend-test:
    name: backend test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # fastapi/uvicorn/numpy/soundfile 是核心依赖；httpx 供 TestClient 用（dev 里已有）
      - name: Install dev dependencies (no torch / funasr)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # 只 import，不启动服务：确认 FastAPI 应用装配正确且不依赖 ASR 栈
      - name: Import app without ASR stack
        run: python -c "from backend.app.main import app; print('app:', app.title, app.version)"

      - name: pytest
        run: pytest -q

  # ------------------------------------------------------------------ 前端
  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注意：不能在 job 级写 if: hashFiles(...)，那时还没 checkout，hashFiles 恒为空。
      # 所以在 checkout 之后用 step 输出做守卫。
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json 存在，将执行 npm 构建"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json 不存在，跳过前端构建"
          fi

      - name: Set up Node 20
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # 只有 lock 文件存在时才启用 npm 缓存，否则 setup-node 会因找不到缓存路径报错
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci (lockfile present)
        if: steps.detect.outputs.present == 'true' && hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: npm install (no lockfile)
        if: steps.detect.outputs.present == 'true' && hashFiles('frontend/package-lock.json') == ''
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: npm run build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      # FastAPI 只托管 frontend/dist（见 backend/app/config.py 的 FRONTEND_DIST）
      - name: Verify dist output
        if: steps.detect.outputs.present == 'true'
        run: test -f frontend/dist/index.html
