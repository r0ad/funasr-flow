name: 功能建议
description: 想要的新能力（新引擎、导出格式、界面交互、部署方式等）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。本项目坚持**本地优先**：默认不上传音频、不联网推理（首次下载模型除外）。
        涉及云端 API / 遥测 / 账号体系的方案请先说明隐私边界，否则大概率不会被接受。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 issue / discussions，确认不是重复建议
          required: true
        - label: 我理解本项目不做云端上传和遥测
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景 / 痛点
      description: 先讲清楚"为什么需要"，再说"要什么"。
      placeholder: 例如：一次要转 300 通电话，现在只能一个个看进度，想按日期批量选。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述你希望它长什么样、怎么用。如果有替代方案也写在这里。
      placeholder: 例如：文件列表支持按 mtime 区间筛选 + 全选当前筛选结果入队。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 转写 / 说话人分离（ASR 引擎、模型）
        - 队列 / 任务调度
        - 文件库 / 扫描 / 音频播放
        - 导出（txt/md/srt/json/zip）
        - 声纹库
        - 前端界面
        - 部署（Docker / CI / 打包）
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: privacy
    attributes:
      label: 是否涉及音频离开本机
      options:
        - "否：完全本地处理"
        - "是：需要访问外部服务"
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在用什么办法绕过这个问题？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考实现、相关链接
    validations:
      required: false
